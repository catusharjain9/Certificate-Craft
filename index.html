<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Certificate Craft — CA certificate preparation workspace">
  <title>Certificate Craft — CA Workspace</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f9;color:#15263d}
    header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#15263d;color:white}
    header strong{font-size:17px}header span{font-size:12px;color:#c6d2e0}
    main{height:calc(100% - 58px)}iframe{width:100%;height:100%;border:0;display:block}
    .fallback{padding:24px;text-align:center}a{color:#187d78}
  </style>
</head>
<body>
  <header><strong>Certificate Craft</strong><span>CA practice workspace</span></header>
  <main>
    <iframe src="https://certificate-craft-web.vercel.app" title="Certificate Craft application" allow="clipboard-read; clipboard-write" loading="eager">
    </iframe>
    <noscript><div class="fallback">Please enable JavaScript to use Certificate Craft. <a href="https://certificate-craft-web.vercel.app">Open the application</a>.</div></noscript>
  </main>
</body>
</html>
