<html lang="en">
<head>

<meta name="theme-color" content="#142b4a"><meta name="description" content="Certificate Craft — a private, browser-based workspace for preparing professional financial certificates.">
<title>Certificate Craft</title>
<style>
:root{--navy:#142b4a;--blue:#2e5d91;--ink:#202c3b;--muted:#687789;--line:#dfe6ee;--paper:#fff;--bg:#f3f6fa;--gold:#c8a86b;--green:#21775a;--red:#a13d3d;--shadow:0 8px 28px #172b4410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{display:grid;place-items:center;width:39px;height:39px;border:1px solid #d9c18b;border-radius:11px;color:#e1c98d;font-size:22px;font-family:Georgia,serif}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:#afbed0;font-size:11px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#94a9bf;padding:0 12px;margin:4px 0 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9d5e2;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid #ffffff20;padding:17px 9px 0;color:#a9bbcd;font-size:11px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:16px}.crumb{color:var(--muted);font-size:12px}.topbar h1{font-size:18px;margin:2px 0 0;color:var(--navy)}.top-actions{display:flex;gap:9px}.content{padding:30px 34px 50px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.pagehead h2{font-size:25px;letter-spacing:-.5px;margin:0 0 5px;color:var(--navy)}.pagehead p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:600}.btn:hover{filter:brightness(.98);box-shadow:0 2px 8px #122b4510}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gold{background:#f4ebd8;border-color:#e7d7b4;color:#6e5528}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel,.form-card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px 20px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat .num{font-size:28px;font-weight:700;letter-spacing:-.7px;color:var(--navy);margin-top:8px}.stat .note{font-size:11px;color:var(--muted);margin-top:2px}.stat-icon{width:35px;height:35px;display:grid;place-items:center;background:#edf3f9;border-radius:10px;color:var(--blue);font-size:17px}.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:18px}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-head h3{margin:0;font-size:15px;color:var(--navy)}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;font-size:12px}th{color:var(--muted);font-weight:600;background:#fbfcfe}td strong{color:var(--navy)}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf5ef;color:var(--green)}.pill.draft{background:#fff3dc;color:#946719}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px;text-align:left;display:flex;gap:12px;align-items:center}.quick:hover{border-color:#a9bfd6;background:#f9fbfd}.quick .qico{font-size:19px;color:var(--blue)}.quick b{display:block;font-size:12px;color:var(--navy)}.quick small{color:var(--muted);font-size:11px}.empty{padding:30px 15px;text-align:center;color:var(--muted)}.editor-layout{display:grid;grid-template-columns:minmax(350px,1fr) minmax(340px,.9fr);gap:20px;align-items:start}.form-card{padding:21px}.section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);padding-bottom:9px;border-bottom:1px solid var(--line);margin:20px 0 14px}.section-title:first-child{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#4f5f71;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #d7e0e9;border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#668bb4;box-shadow:0 0 0 3px #2e5d9113}.field textarea{min-height:76px;resize:vertical}.hint{font-size:10px;color:var(--muted)}.form-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.preview-wrap{position:sticky;top:18px}.preview-toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.preview-toolbar strong{color:var(--navy)}.paper{background:#fff;border:1px solid #dce2e9;box-shadow:0 10px 35px #1c324918;padding:42px 38px;min-height:610px;color:#252b32;font-family:"Times New Roman",serif;font-size:12px;line-height:1.55}.paper .paper-brand{text-align:center;color:var(--navy);font:bold 14px Arial,sans-serif;letter-spacing:.8px}.paper .paper-title{text-align:center;font-weight:bold;text-decoration:underline;font-size:14px;margin:28px 0 22px}.paper p{margin:10px 0;text-align:justify}.paper .subject{text-align:center;font-weight:bold;margin:18px 0}.paper .signature{margin-top:45px;text-align:right}.paper .sigline{margin-top:35px;border-top:1px solid #555;display:inline-block;padding-top:5px;min-width:170px;text-align:center}.paper .footnote{margin-top:35px;border-top:1px solid #ccc;padding-top:8px;color:#666;font-size:10px}.paper table{min-width:0;margin:14px 0}.paper th,.paper td{font-family:"Times New Roman",serif;font-size:11px;border:1px solid #777;padding:5px}.paper th{background:#f2f2f2;color:#222}.searchbar{display:flex;gap:10px;margin-bottom:15px}.searchbar input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.list-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.mini-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.mini-card h3{margin:0 0 5px;color:var(--navy);font-size:14px}.mini-card p{color:var(--muted);font-size:12px;margin:0 0 14px}.mini-card .actions{display:flex;gap:7px;flex-wrap:wrap}.notice{border:1px solid #eadbb7;background:#fff9ea;color:#765a22;border-radius:9px;padding:12px 14px;font-size:12px;margin-bottom:18px}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.setting-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.setting-card h3{margin:0 0 14px;color:var(--navy);font-size:14px}.file-label{display:inline-flex;align-items:center;gap:7px}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#142b4a;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:50}.mobile-menu{display:none}
@media(max-width:1050px){.shell{grid-template-columns:205px 1fr}.content{padding:24px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-layout{grid-template-columns:1fr}.preview-wrap{position:static}.list-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.shell{display:block}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:30;box-shadow:0 0 0 100vmax #101b2b66}.topbar{height:68px;padding:0 14px}.mobile-menu{display:inline-flex}.top-actions .hide-mobile{display:none}.content{padding:20px 13px 35px}.pagehead{flex-direction:column}.pagehead h2{font-size:22px}.stats{gap:9px}.stat{padding:14px}.stat .num{font-size:23px}.grid2,.setting-grid{grid-template-columns:1fr}.list-cards{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.editor-layout{display:block}.preview-wrap{margin-top:20px}.paper{padding:28px 23px;min-height:500px}.quick-actions{grid-template-columns:1fr 1fr}.panel{padding:14px}.form-card{padding:15px}.topbar h1{font-size:16px}}
@media print{body{background:#fff}.sidebar,.topbar,.pagehead,.form-card,.preview-toolbar,.no-print{display:none!important}.shell,.main,.content,.editor-layout,.preview-wrap{display:block!important;padding:0!important;margin:0!important;max-width:none!important}.paper{border:0;box-shadow:none;min-height:0;padding:15mm 18mm;font-size:12pt}.paper table{page-break-inside:avoid}.paper p{orphans:3;widows:3}@page{size:A4;margin:10mm}}
</style></head>
<body><div class="shell">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">C</div><div><strong>Certificate Craft</strong><small>Professional workspace</small></div></div>
<div><div class="nav-label">Workspace</div><nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
<button data-page="certificates"><span class="ico">▤</span>Certificates</button>
<button data-page="firms"><span class="ico">▥</span>Firm profiles</button>
<button data-page="signatories"><span class="ico">✍</span>Signatory profiles</button>
<button data-page="templates"><span class="ico">▧</span>Templates</button>
</nav></div><div><div class="nav-label">Manage</div><nav class="nav"><button data-page="settings"><span class="ico">⚙</span>Settings & backup</button></nav></div>
<div class="sidebar-foot">Private browser workspace<br>Data is stored on this device.</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div><div class="crumb">Workspace / <span id="crumb">Dashboard</span></div><h1 id="topTitle">Dashboard</h1></div></div><div class="top-actions"><button class="btn hide-mobile" id="backupTop">Export backup</button><button class="btn primary" id="newTop">＋ New certificate</button></div></header>
<div class="content" id="app"></div></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
'use strict';
const KEY='certificateCraftStandalone_v1';
const defaultState={certificates:[],firms:[],signatories:[],settings:{currency:'INR',defaultPlace:'Surat',defaultFirm:'',defaultSignatory:'',footer:'This certificate is issued based on the information and documents made available to us.'}};
let state=loadState(),page='dashboard',editingId=null,searchText='';
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function loadState(){try{return {...structuredClone(defaultState),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultState)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){let n=Number(v)||0;return '₹'+new Intl.NumberFormat('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0}).format(n)}
function dateText(v){if(!v)return '—';try{return new Date(v+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return v}}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function setPage(p){page=p;editingId=null;searchText='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('crumb').textContent=pageTitle(p);$('topTitle').textContent=pageTitle(p);$('sidebar').classList.remove('open');render()}
function pageTitle(p){return ({dashboard:'Dashboard',certificates:'Certificates',editor:editingId?'Edit certificate':'New certificate',firms:'Firm profiles',signatories:'Signatory profiles',templates:'Certificate templates',settings:'Settings & backup'})[p]||'Certificate Craft'}
function shellHead(title,desc,button=''){return '<div class="pagehead"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+button+'</div>'}
function stat(label,num,note,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="num">'+num+'</div><div class="note">'+note+'</div></div>'}
function recentTable(items){if(!items.length)return '<div class="empty">No certificates yet. Create your first certificate to get started.</div>';return '<div class="table-wrap"><table><thead><tr><th>Certificate</th><th>Client / Entity</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>'+items.slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,7).map(c=>'<tr><td><strong>'+esc(c.title||'Untitled certificate')+'</strong><br><span class="muted">'+esc(c.number||'No reference')+'</span></td><td>'+esc(c.client||'—')+'</td><td>'+dateText(c.date)+'</td><td><span class="pill '+(c.status==='Final'?'':'draft')+'">'+esc(c.status||'Draft')+'</span></td><td><button class="btn small" data-edit="'+c.id+'">Open</button></td></tr>').join('')+'</tbody></table></div>'}
function dashboard(){let drafts=state.certificates.filter(c=>c.status!=='Final').length,finals=state.certificates.length-drafts;return shellHead('Good work starts with a clear record.','Prepare, organize and print professional financial certificates.','<button class="btn primary" data-action="new">＋ Create certificate</button>')+'<div class="stats">'+stat('Total certificates',state.certificates.length,'All saved records','▤')+stat('Drafts',drafts,'Work in progress','✎')+stat('Finalized',finals,'Marked as final','✓')+stat('Firm profiles',state.firms.length,'Available issuing profiles','▥')+'</div><div class="grid2"><section class="panel"><div class="panel-head"><h3>Recent certificates</h3><button class="btn small" data-page="certificates">View all</button></div>'+recentTable(state.certificates)+'</section><section class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div class="quick-actions"><button class="quick" data-action="new"><span class="qico">＋</span><span><b>New certificate</b><small>Start a new document</small></span></button><button class="quick" data-page="firms"><span class="qico">▥</span><span><b>Firm profiles</b><small>Manage practice details</small></span></button><button class="quick" data-page="signatories"><span class="qico">✍</span><span><b>Signatories</b><small>CA and membership details</small></span></button><button class="quick" data-page="settings"><span class="qico">⇧</span><span><b>Backup data</b><small>Export or restore records</small></span></button></div><div class="notice" style="margin:17px 0 0">Documents are saved in this browser on this device. Export backups regularly; clearing browser data may remove saved records.</div></section></div>'}
function certificatesPage(){let list=state.certificates.filter(c=>(c.title+' '+c.client+' '+c.number+' '+c.status).toLowerCase().includes(searchText.toLowerCase()));return shellHead('Certificates','Search and manage your saved certificate drafts.','<button class="btn primary" data-action="new">＋ New certificate</button>')+'<div class="panel"><div class="searchbar"><input id="searchInput" placeholder="Search by title, client or reference…" value="'+esc(searchText)+'"><button class="btn" data-action="clearSearch">Clear</button></div>'+recentTable(list)+'</div>'}
function opts(arr,selected,empty){return (empty?'<option value="">'+empty+'</option>':'')+arr.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===selected?'selected':'')+'>'+esc(x.name)+'</option>').join('')}
function editor(){let c=state.certificates.find(x=>x.id===editingId)||{id:uid(),title:'Net Worth Certificate',number:'',date:new Date().toISOString().slice(0,10),client:'',pan:'',address:'',purpose:'',asOn:new Date().toISOString().slice(0,10),assetsBank:'',assetsInvest:'',assetsImmovable:'',assetsOther:'',liabilitiesLoan:'',liabilitiesOther:'',notes:'',firmId:state.settings.defaultFirm,signatoryId:state.settings.defaultSignatory,place:state.settings.defaultPlace,status:'Draft'};window.currentDraft=c;
return shellHead(editingId?'Edit certificate':'New certificate','Enter the available details. The preview updates as you type.','<button class="btn" data-page="certificates">← Back to list</button>')+'<div class="notice">Review every figure, assumption and statement before issuing a certificate. This tool is a drafting aid and does not replace professional judgment or applicable ICAI requirements.</div><div class="editor-layout"><form class="form-card" id="certForm"><div class="section-title">Certificate details</div><div class="fields">'+field('Certificate title','title',c.title,'text')+field('Reference / certificate no.','number',c.number)+field('Certificate date','date',c.date,'date')+field('As on date','asOn',c.asOn,'date')+field('Client / entity name','client',c.client)+field('PAN / identification no.','pan',c.pan)+field('Place of issue','place',c.place)+field('Purpose','purpose',c.purpose,'text',true)+'</div><div class="section-title">Client information</div><div class="fields">'+field('Address','address',c.address,'text',true)+'</div><div class="section-title">Financial particulars (₹)</div><div class="fields">'+field('Bank balances','assetsBank',c.assetsBank,'number')+field('Investments','assetsInvest',c.assetsInvest,'number')+field('Immovable property','assetsImmovable',c.assetsImmovable,'number')+field('Other assets','assetsOther',c.assetsOther,'number')+field('Loans / borrowings','liabilitiesLoan',c.liabilitiesLoan,'number')+field('Other liabilities','liabilitiesOther',c.liabilitiesOther,'number')+'</div><div class="fields" style="margin-top:14px"><div class="field full"><label>Additional notes / basis / exclusions</label><textarea name="notes" placeholder="Add assumptions, scope limits or notes to be included in the draft.">'+esc(c.notes)+'</textarea></div></div><div class="section-title">Issuing details</div><div class="fields"><div class="field"><label>Firm profile</label><select name="firmId">'+opts(state.firms,c.firmId,'— Select firm —')+'</select></div><div class="field"><label>Signatory profile</label><select name="signatoryId">'+opts(state.signatories,c.signatoryId,'— Select signatory —')+'</select></div><div class="field"><label>Document status</label><select name="status"><option '+(c.status==='Draft'?'selected':'')+'>Draft</option><option '+(c.status==='Final'?'selected':'')+'>Final</option></select></div></div><div class="form-actions"><button type="button" class="btn danger" data-action="resetForm">Reset fields</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-action="saveDraft">Save draft</button><button type="submit" class="btn primary">Save certificate</button></div></div></form><div class="preview-wrap"><div class="preview-toolbar"><strong>Live A4 preview</strong><button class="btn small" data-action="print">Print / Save PDF</button></div><div class="paper" id="paper"></div><div class="hint" style="margin-top:9px">Use your browser&#39;s print dialog and select “Save as PDF” to export a PDF.</div></div></div>'}
function field(label,name,value,type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="0.01"':'')+'></div>'}
function firmPage(){return shellHead('Firm profiles','Keep practice name and registration details ready for reuse.','<button class="btn primary" data-action="addFirm">＋ Add firm</button>')+'<div class="notice">Profiles are stored locally in this browser. Confirm firm and registration details before using a certificate.</div><div class="list-cards">'+(state.firms.length?state.firms.map(f=>'<article class="mini-card"><h3>'+esc(f.name)+'</h3><p>'+esc(f.address||'No address added')+'<br>FRN: '+esc(f.frn||'—')+'<br>'+esc(f.email||'')+'</p><div class="actions"><button class="btn small" data-firm="'+f.id+'">Edit</button><button class="btn small danger" data-del-firm="'+f.id+'">Delete</button></div></article>').join(''):'<div class="panel empty">No firm profiles saved yet.</div>')+'</div>'}
function signatoryPage(){return shellHead('Signatory profiles','Manage authorized signatory details for document drafts.','<button class="btn primary" data-action="addSignatory">＋ Add signatory</button>')+'<div class="list-cards">'+(state.signatories.length?state.signatories.map(s=>'<article class="mini-card"><h3>'+esc(s.name)+'</h3><p>Membership no.: '+esc(s.membership||'—')+'<br>Designation: '+esc(s.designation||'—')+'<br>'+esc(s.email||'')+'</p><div class="actions"><button class="btn small" data-signatory="'+s.id+'">Edit</button><button class="btn small danger" data-del-signatory="'+s.id+'">Delete</button></div></article>').join(''):'<div class="panel empty">No signatory profiles saved yet.</div>')+'</div>'}
const templates=[['Net Worth Certificate','Draft a summary of stated assets and liabilities.'],['Turnover Certificate','Structure turnover information and reporting period.'],['Income Certificate','Record income figures and the period covered.'],['Balance Confirmation','Prepare a confirmation draft for a specified balance.'],['General Financial Certificate','Start with a flexible financial certificate layout.']];
function templatePage(){return shellHead('Certificate templates','Choose a starting point. Templates are drafting structures, not prescribed formats.','')+'<div class="list-cards">'+templates.map((t,i)=>'<article class="mini-card"><div class="stat-icon" style="margin-bottom:13px">▤</div><h3>'+t[0]+'</h3><p>'+t[1]+'</p><div class="actions"><button class="btn primary small" data-template="'+i+'">Use template</button></div></article>').join('')+'</div>'}
function settingsPage(){return shellHead('Settings & backup','Control defaults and manage a portable copy of your local data.','')+'<div class="setting-grid"><section class="setting-card"><h3>Workspace defaults</h3><form id="settingsForm"><div class="fields">'+field('Default place','defaultPlace',state.settings.defaultPlace||'')+'<div class="field"><label>Currency</label><select name="currency"><option value="INR" selected>INR — Indian Rupee</option></select></div><div class="field"><label>Default firm</label><select name="defaultFirm">'+opts(state.firms,state.settings.defaultFirm,'— None —')+'</select></div><div class="field"><label>Default signatory</label><select name="defaultSignatory">'+opts(state.signatories,state.settings.defaultSignatory,'— None —')+'</select></div><div class="field full"><label>Default disclaimer / footer</label><textarea name="footer">'+esc(state.settings.footer||'')+'</textarea></div></div><button class="btn primary" style="margin-top:15px">Save settings</button></form></section><section class="setting-card"><h3>Backup & restore</h3><p class="muted">Export a JSON backup containing certificates, firm profiles, signatory profiles and settings. Keep it in a secure location.</p><button class="btn primary" data-action="backup">⇩ Download backup</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><label class="file-label btn">⇧ Restore backup<input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></label><p class="hint">Restoring replaces the current browser data. Export a backup first if you need to preserve existing records.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Privacy & limitations</h3><p class="muted">This website runs in your browser and does not send your records to a server. Data may be lost if browser storage is cleared. This version does not provide accounts, cloud sync, team collaboration, a verified DOCX exporter or automated legal validation.</p><button class="btn danger" data-action="clearAll">Clear all local data</button></section></div>'}
function render(){const root=$('app');if(page==='dashboard')root.innerHTML=dashboard();else if(page==='certificates')root.innerHTML=certificatesPage();else if(page==='editor')root.innerHTML=editor();else if(page==='firms')root.innerHTML=firmPage();else if(page==='signatories')root.innerHTML=signatoryPage();else if(page==='templates')root.innerHTML=templatePage();else root.innerHTML=settingsPage();if(page==='editor'){bindForm();updatePreview()}if(page==='settings'){const sf=$('settingsForm');if(sf)sf.addEventListener('submit',saveSettings)} }
function collectForm(){const form=$('certForm');if(!form)return null;const data=Object.fromEntries(new FormData(form).entries());return {...window.currentDraft,...data,updatedAt:new Date().toISOString()}}
function bindForm(){const f=$('certForm');if(!f)return;f.addEventListener('input',updatePreview);f.addEventListener('change',updatePreview);f.addEventListener('submit',e=>{e.preventDefault();saveCertificate(false)})}
function getFirm(id){return state.firms.find(x=>x.id===id)||{}}
function getSignatory(id){return state.signatories.find(x=>x.id===id)||{}}
function total(c,keys){return keys.reduce((s,k)=>s+(Number(c[k])||0),0)}
function updatePreview(){if(page!=='editor'||!$('certForm'))return;const c=collectForm();const firm=getFirm(c.firmId),sig=getSignatory(c.signatoryId);const assets=total(c,['assetsBank','assetsInvest','assetsImmovable','assetsOther']),liabs=total(c,['liabilitiesLoan','liabilitiesOther']),net=assets-liabs;const lines=[['Bank balances',c.assetsBank],['Investments',c.assetsInvest],['Immovable property',c.assetsImmovable],['Other assets',c.assetsOther],['Total assets',assets],['Loans / borrowings',c.liabilitiesLoan],['Other liabilities',c.liabilitiesOther],['Total liabilities',liabs],['Net worth',net]];const table='<table><thead><tr><th>Particulars</th><th style="text-align:right">Amount (₹)</th></tr></thead><tbody>'+lines.map((r,i)=>'<tr '+([4,7,8].includes(i)?'style="font-weight:bold"':'')+'><td>'+r[0]+'</td><td style="text-align:right">'+money(r[1])+'</td></tr>').join('')+'</tbody></table>';$('paper').innerHTML='<div class="paper-brand">'+esc(firm.name||'NAME OF CHARTERED ACCOUNTANT / FIRM')+'</div>'+(firm.address?'<div style="text-align:center;font-size:10px">'+esc(firm.address)+'</div>':'')+'<div class="paper-title">'+esc(c.title||'CERTIFICATE')+'</div><p><b>To whom it may concern</b></p><p>This is to certify that, based on the information, explanations and records made available to us, the particulars stated below in respect of <b>'+esc(c.client||'[Client / Entity Name]')+'</b>'+(c.pan?' (PAN / ID: '+esc(c.pan)+')':'')+' have been compiled for the stated purpose. '+(c.purpose?'Purpose: '+esc(c.purpose)+'.':'')+'</p>'+(c.address?'<p>Address: '+esc(c.address)+'</p>':'')+'<p>The financial particulars as on <b>'+dateText(c.asOn)+'</b> are set out below:</p>'+table+(c.notes?'<p><b>Notes / basis:</b> '+esc(c.notes)+'</p>':'')+'<p>This certificate is based solely on the records and explanations made available to us and is subject to the scope, purpose and limitations agreed for this engagement. It should not be used for any other purpose without appropriate review.</p>'+(state.settings.footer?'<p>'+esc(state.settings.footer)+'</p>':'')+'<div class="signature"><div>For <b>'+esc(firm.name||'[Firm Name]')+'</b></div><div class="sigline">'+esc(sig.name||'[Authorized Signatory]')+'<br>'+esc(sig.designation||'Chartered Accountant')+(sig.membership?'<br>Membership No.: '+esc(sig.membership):'')+(firm.frn?'<br>FRN: '+esc(firm.frn):'')+'</div></div><div class="footnote">Date: '+dateText(c.date)+' &nbsp; | &nbsp; Place: '+esc(c.place||'—')+(c.number?' &nbsp; | &nbsp; Ref: '+esc(c.number):'')+'</div>'}
function saveCertificate(keepEditing){let c=collectForm();if(!c)return;if(!c.client.trim()){toast('Enter the client / entity name first.');return}const old=state.certificates.findIndex(x=>x.id===c.id);if(old>=0)state.certificates[old]=c;else state.certificates.unshift(c);persist();editingId=keepEditing?c.id:null;toast('Certificate saved in this browser.');if(!keepEditing)setPage('certificates');else render()}
function saveSettings(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());state.settings={...state.settings,...d};persist();toast('Settings saved.');render()}
function startNew(title){editingId=null;page='editor';render();if(title){const input=$('certForm')?.elements.namedItem('title');if(input){input.value=title;updatePreview()}}}
function editCert(id){editingId=id;page='editor';render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function backup(){download('certificate-craft-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Certificate Craft',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast('Backup exported.')}
function restore(file){const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),d=parsed.data||parsed;if(!Array.isArray(d.certificates)||!Array.isArray(d.firms)||!Array.isArray(d.signatories))throw Error('Invalid backup format');if(!confirm('Replace all current local records with this backup?'))return;state={...structuredClone(defaultState),...d};persist();render();toast('Backup restored.')}catch(e){toast('Could not restore: invalid backup file.')}};r.readAsText(file)}
function addProfile(kind,id){const list=kind==='firm'?'firms':'signatories',old=state[list].find(x=>x.id===id)||{},firm=kind==='firm';const name=prompt(firm?'Firm / practice name:':'Signatory full name:',old.name||'');if(name===null)return;if(!name.trim()){toast('Name is required.');return}const profile={...old,id:old.id||uid(),name:name.trim()};if(firm){profile.address=prompt('Firm address:',old.address||'')||'';profile.frn=prompt('Firm registration number (FRN):',old.frn||'')||'';profile.email=prompt('Email (optional):',old.email||'')||''}else{profile.membership=prompt('Membership number:',old.membership||'')||'';profile.designation=prompt('Designation:',old.designation||'Chartered Accountant')||'';profile.email=prompt('Email (optional):',old.email||'')||''}const i=state[list].findIndex(x=>x.id===profile.id);if(i>=0)state[list][i]=profile;else state[list].push(profile);persist();render();toast('Profile saved.')}
function doAction(action){if(action==='new')startNew();if(action==='saveDraft')saveCertificate(true);if(action==='print'){updatePreview();window.print()}if(action==='backup')backup();if(action==='clearSearch'){searchText='';render()}if(action==='addFirm')addProfile('firm');if(action==='addSignatory')addProfile('signatory');if(action==='resetForm'&&confirm('Reset all fields in this certificate form?')){editingId=null;render()}if(action==='clearAll'&&confirm('Permanently clear all Certificate Craft records from this browser? Export a backup first if needed.')){state=structuredClone(defaultState);persist();render();toast('Local records cleared.')} }
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const edit=e.target.closest('[data-edit]');if(edit){editCert(edit.dataset.edit);return}const action=e.target.closest('[data-action]');if(action){doAction(action.dataset.action);return}const firm=e.target.closest('[data-firm]');if(firm){addProfile('firm',firm.dataset.firm);return}const sign=e.target.closest('[data-signatory]');if(sign){addProfile('signatory',sign.dataset.signatory);return}const df=e.target.closest('[data-del-firm]');if(df&&confirm('Delete this firm profile? Existing certificates keep their saved reference.')){state.firms=state.firms.filter(x=>x.id!==df.dataset.delFirm);persist();render()}const ds=e.target.closest('[data-del-signatory]');if(ds&&confirm('Delete this signatory profile?')){state.signatories=state.signatories.filter(x=>x.id!==ds.dataset.delSignatory);persist();render()}const temp=e.target.closest('[data-template]');if(temp){const titles=['Net Worth Certificate','Turnover Certificate','Income Certificate','Balance Confirmation','General Financial Certificate'];startNew(titles[Number(temp.dataset.template)])}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){searchText=e.target.value;const pos=e.target.selectionStart;render();const n=$('searchInput');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
$('newTop').addEventListener('click',()=>startNew());$('backupTop').addEventListener('click',backup);$('menuBtn').addEventListener('click',()=>$('sidebar').classList.toggle('open'));document.addEventListener('change',e=>{if(e.target.id==='restoreFile'&&e.target.files[0])restore(e.target.files[0])});
render();
})();
</script></body></html>
